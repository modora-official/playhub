<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="https://playhub.web.id/ph.png">
    
    <title>404 - Halaman Tidak Ditemukan | Playhub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0e;
            --card-bg: #121218;
            --accent-purple: #9D00FF;
            --accent-gold: #FFD700;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #242433;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100dvh; /* Mutlak di tengah pada HP */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(255, 215, 0, 0.08) 0%, rgba(10,10,14,0) 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .error-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 50px 30px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(157, 0, 255, 0.1);
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            margin: auto;
        }

        @keyframes slideUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Area Angka 404 */
        .error-code {
            font-size: 100px;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(157, 0, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .error-code i {
            font-size: 80px;
            color: var(--accent-gold);
            -webkit-text-fill-color: initial;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        h2 {
            font-size: 24px;
            color: #fff;
            margin-bottom: 15px;
            font-weight: 700;
        }

        p {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Tombol Kembali */
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--accent-purple);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border: 1px solid rgba(157, 0, 255, 0.5);
            box-shadow: 0 10px 20px rgba(157, 0, 255, 0.2);
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn-home:hover {
            background: #b033ff;
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(157, 0, 255, 0.4);
            color: var(--accent-gold);
        }

        /* Penyesuaian Ekstra untuk HP */
        @media (max-width: 480px) {
            .error-container { padding: 40px 25px; }
            .error-code { font-size: 80px; }
            .error-code i { font-size: 60px; }
            h2 { font-size: 20px; }
            p { font-size: 14px; }
        }
        
        @media (max-width: 360px) {
            .error-code { font-size: 65px; }
            .error-code i { font-size: 50px; }
            h2 { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="error-container">
        <div class="error-code">
            4<i class="fa-solid fa-ghost"></i>4
        </div>
        <h2>Halaman Tidak Ditemukan</h2>
        <p>Waduh! Sepertinya URL yang Anda masukkan salah, atau halaman tersebut sudah dipindahkan ke dimensi lain.</p>
        
        <a href="/" class="btn-home">
            <i class="fa-solid fa-house"></i> Kembali ke Beranda
        </a>
    </div>

</body>
</html>
