<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="icon" type="image/png" href="https://playhub.web.id/ph.png">
    
    <title>Konfirmasi Usia - Playhub</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0a0e;
            --card-bg: #121218;
            --accent-purple: #9D00FF;
            --accent-gold: #FFD700;
            --danger-color: #ff3b3b;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #242433;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            outline: none !important;
            -webkit-tap-highlight-color: transparent !important;
        }

        html, body {
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            /* Menggunakan 100dvh agar presisi di tengah layar HP modern */
            min-height: 100dvh; 
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden; 
            position: relative;
        }

        /* Efek Background Cahaya 3D */
        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, rgba(157,0,255,0.1) 0%, rgba(10,10,14,0) 60%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
        }

        .confirmation-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            /* Memastikan ada jarak di kiri-kanan layar HP */
            width: 90%; 
            max-width: 420px; 
            margin: auto; /* Paksa mutlak di tengah */
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(157, 0, 255, 0.1);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Logo Area */
        .logo-area { margin-bottom: 25px; }
        .logo-area h1 {
            font-size: 28px; font-weight: 700; display: flex;
            justify-content: center; align-items: center; gap: 10px; letter-spacing: 0.5px;
        }
        .logo-area i { color: var(--accent-purple); font-size: 30px; }
        .logo-play { color: var(--accent-gold); }
        .logo-hub { color: var(--accent-purple); }

        .icon-warning {
            font-size: 65px; color: var(--accent-gold); margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.3));
        }

        h2 { font-size: 22px; margin-bottom: 12px; color: #fff; }
        p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; margin-bottom: 30px; }

        /* Tombol Aksi */
        .btn-group { display: flex; flex-direction: column; gap: 12px; }

        .btn {
            width: 100%; padding: 14px; border-radius: 10px; font-size: 15px;
            font-weight: 600; cursor: pointer; border: none; transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-accept {
            background: var(--accent-purple); color: #fff;
            border: 1px solid rgba(157, 0, 255, 0.5); box-shadow: 0 10px 20px rgba(157, 0, 255, 0.2);
        }
        .btn-accept:hover {
            background: #b033ff; transform: translateY(-2px); box-shadow: 0 15px 25px rgba(157, 0, 255, 0.4);
        }

        .btn-decline {
            background: #1a1a24; color: var(--text-secondary); border: 1px solid var(--border-color);
        }
        .btn-decline:hover {
            background: #232332; color: var(--danger-color); border-color: rgba(255, 59, 59, 0.3);
        }

        /* Halaman Ditolak (Fallback) */
        .denied-screen {
            display: none; text-align: center; z-index: 20; position: fixed;
            top: 0; left: 0; width: 100%; height: 100dvh; background: var(--bg-color);
            align-items: center; justify-content: center; flex-direction: column; padding: 20px;
        }
        .denied-screen i { font-size: 70px; color: var(--danger-color); margin-bottom: 20px; }

        /* Penyesuaian Ekstra untuk Layar HP Super Kecil */
        @media (max-width: 380px) {
            .confirmation-card { padding: 30px 20px; }
            .logo-area h1 { font-size: 24px; }
            .icon-warning { font-size: 55px; }
            h2 { font-size: 20px; }
            p { font-size: 13px; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="confirmation-card" id="confirmCard">
        <div class="logo-area">
            <h1>
                <i class="fa-solid fa-play"></i> 
                <span class="logo-text"><span class="logo-play">PLAY</span><span class="logo-hub">HUB</span></span>
            </h1>
        </div>
        
        <i class="fa-solid fa-triangle-exclamation icon-warning"></i>
        <h2>Konfirmasi Usia</h2>
        <p>Situs ini mungkin berisi konten dewasa. Dengan masuk, Anda mengonfirmasi bahwa Anda berusia <strong>18 tahun atau lebih</strong> dan setuju untuk melihat konten tersebut.</p>
        
        <div class="btn-group">
            <button class="btn btn-accept" onclick="acceptAge()">
                <i class="fa-solid fa-check"></i> Ya, Saya Berusia 18+
            </button>
            
            <button class="btn btn-decline" onclick="declineAge()">
                <i class="fa-solid fa-xmark"></i> Keluar
            </button>
        </div>
    </div>

    <div class="denied-screen" id="deniedScreen">
        <i class="fa-solid fa-ban"></i>
        <h2>Akses Ditolak</h2>
        <p style="color: var(--text-secondary); max-width: 400px; margin-top: 10px;">
            Anda harus berusia 18 tahun ke atas untuk mengakses halaman ini. Silakan tutup tab browser Anda.
        </p>
    </div>

    <script>
        function acceptAge() {
            window.location.href = "../../../../../play";
        }

        function declineAge() {
            window.close();
            document.getElementById('confirmCard').style.display = 'none';
            const deniedScreen = document.getElementById('deniedScreen');
            deniedScreen.style.display = 'flex';
            setTimeout(() => { window.location.replace("about:blank"); }, 3000);
        }
    </script>
</body>
</html>
